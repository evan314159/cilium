name: Fork Build to GHCR

# Builds agent and operator images from this fork and pushes them to GHCR so a
# patched datapath can be deployed to a test cluster. Not for upstream.

on:
  workflow_dispatch: {}
  push:
    branches:
      - test/fix-single-eval

permissions:
  contents: read
  packages: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build ${{ matrix.name }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: cilium
            dockerfile: images/cilium/Dockerfile
            image: cilium
            build-args: ""
          - name: operator
            dockerfile: images/operator/Dockerfile
            image: operator-generic
            build-args: "OPERATOR_VARIANT=operator-generic"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN could not create these packages from this fork, so a PAT
      # with write:packages is stored as the GHCR_TOKEN secret.
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          # Only the arch of the test cluster, to keep build times down.
          platforms: linux/amd64
          target: release
          build-args: ${{ matrix.build-args }}
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ matrix.image }}:fix-single-eval
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
